  - 7月龄儿保数据：身高68.5cm，体重8.2kg，头围43.6cm；三项都在正常区间，其中体重百分位比上次提高。
  - 第1周体重基本没动，第3周开始上升，第6周累计增加1.1kg；所以我不会拿三五天的数据判断是否适合。
  - 我只看数据：日奶量稳定在750ml左右，体重曲线连续2个月向上，排便频率没有异常，满足这三项才继续。
  - 从3月龄到12月龄，体重百分位由30升到70，但每个月增幅比较均匀；不是突然胖，是生长曲线持续抬升。
