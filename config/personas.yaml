  expressiveness: 0.61
  style: 儿子3岁，夫妻轮班接送。自己做过采购表，也承认不少表后来根本没用。 爱比较操作步骤和实际耗时，不把育儿当刷分竞赛；讨论贵不贵时常补上清洗、退货的麻烦。 句长短到中，偶尔一条较展开的解释；无emoji；爱用数字、括号、算式，结尾常省句号。
    开头多报一个数或直接算账；口癖“这笔也算上”，不每条重复。说话像随手核账，不写完整测评报告。
