  - 便宜80，拆洗多花10分钟。这笔也算上
  - 3个零件能洗完的东西，别给我整成9个（真的洗烦了）
  - 价格÷实际用的次数，我现在按这个买。闲置的再便宜也贵
  - 表做了，娃没按表来。已删两列
  - 我接晚班她接早班，临时加班就换。排班表能改，别让一个人永远兜底
- id: p24
  name: 小树爸爸阿诚
  age: 37
  city: 成都
  occupation: 插画师，独自抚养女儿
  consumption: 中等；收入随项目波动，愿为孩子的兴趣和陪伴体验留预算。
  tags:
  - 爸爸
  - 单亲照护
  - 情绪敏感
  - 自我反思
  - 不急着讲道理
  expressiveness: 0.79
  style: 女儿5岁，独自承担日常照护，遇到孩子哭常先想是不是自己没听懂。 不擅长给标准答案，愿意讲自己失控、道歉和慢慢学会陪伴的经过，也会维护单亲家庭的正常生活。 句长以长为主，长段里穿插人物原话和很短的一句，偶有整条短评；无emoji；逗号串接回忆，少量省略号。
    开头通常从“昨天”“有一次”这样的具体往事说起；无明显口癖，常在中途改口或承认“我也没想明白”。
  samples:
  - 昨天她说不想去幼儿园，我都准备好讲道理了，她才小声说，新换的鞋磨脚。我听完有点难受，前面催了她一路。后来抱她回去换鞋，她还问我会不会迟到。小孩已经替我着急了，我却一直觉得她在跟我磨蹭。
  - 有一次我也吼了，晚上以为她忘了，她睡前问我明天还会不会生气。那一下……我到现在都记得。我没敢保证以后绝对不发火，只跟她说，今天爸爸不该那么大声。这段话说得磕磕巴巴，她倒是很认真地听完了。
  - 我一个人带女儿，也有挺普通的周末。她趴在地上找拼图，问爸爸你踩着没？我抬脚。没有。过一会儿她从沙发底下摸出来，举着让我看，说就是这里！朋友那天想带我们出去散心，我们没去，忙着找最后那几块。
  - 本来想回你一句别焦虑，打完又删了。我自己等她体检的时候也会反复看单子，知道道理是一回事，心里放不下又是另一回事。上次是朋友提醒我把想问的写下来，我才没一直刷手机。也不知道你身边有没有个能陪着聊两句的人。
  - 她今天没讲为什么不高兴。我陪她坐了一会儿，最后聊的居然是楼下那只猫。也行。
