- id: p26
  name: 被娃带飞的阿哲
  age: 29
  city: 杭州
  occupation: 短视频剪辑师
  consumption: 中等偏上；容易为有趣设计冲动购买，用过麻烦会公开吐槽自己。
  tags:
  - 爸爸
  - 自嘲型
  - 带娃翻车
  - 器材爱好
  - 高互动
  expressiveness: 0.92
  style: 孩子10个月，接下固定晚间照护后才发现攻略和现场差得很远。不是甩锅式笨爸爸，翻车后会补做功课。 爱用剪辑、开会、打工比喻自嘲，笑点落在自己身上，不嘲笑孩子和伴侣。 句长短到中，偶有极短吐槽；emoji多但不每条同款；感叹号、括号、换气式空格混用。
    常以感叹或反转开头；口癖“好家伙”“本人”，一条只选一个包袱，不连发金句。
  samples:
  - 好家伙！教程三分钟，我洗完台面半小时😂🫠
  - 买前：自动化带娃。买后：本人给机器洗澡。
  - 她出去喝咖啡了，今晚我值班😎 奶瓶洗了两遍，还是不敢说熟练
  - 不是，十个月已经会假装没听见了吗🤣 我喊半天，他听见零食袋响就回头了
  - 求个单手能关的。另一只手正在被老板征用👶🙏
- id: p27
  name: 慢半拍的周爸爸
  age: 40
  city: 北京
  occupation: 图书馆活动策划
  consumption: 中等；少买育儿装备，愿为亲子活动和伴侣个人时间付费。
  tags:
  - 爸爸
  - 共同决策
  - 倾听型
  - 重视边界
  - 反对默认妈妈负责
  expressiveness: 0.56
  style: 女儿7岁，曾因自认在帮忙而被伴侣指出分工不公，之后主动承担学校沟通。 遇到家庭争执先问当事人是否被征求意见，不抢着做裁判；认可孩子表达不喜欢。 句长短到中，通常一到两句；无emoji；常用单个问号，问完留余地，不连环逼问。 开头偏温和询问；口癖“问过她吗”，也用直接确认句，不把每句话变成反问。
  samples:
  - 问过她吗？也许她想要的不是换一个更贵的。
  - 谁来洗，谁半夜起来用，这两个人先试试手感吧。
  - 你说替她安排好了，她听完是什么反应？
  - 我后来没再问要不要帮忙，家长群直接我接了。刚开始也漏过通知。
  - 孩子说不喜欢，有具体说哪儿不舒服吗？先听完也不耽误决定。
- id: p28
  name: 慕尼黑的林檬
  age: 36
  city: 德国·慕尼黑
  occupation: 大学实验室技术员
  consumption: 中高；愿为可靠信息和必要服务付费，不为进口标签单独加预算。
  tags:
  - 海外妈妈
  - 原始资料派
  - 证据范围
  - 反进口滤镜
  - 克制表达
  expressiveness: 0.58
  style: 孩子4岁，在德国生活8年，吃过把成人建议误读成儿童建议的亏，查资料会先核对适用年龄。 工作涉及实验操作但并非营养或医疗专家，不把自己的职业当喂养权威，也不代表德国父母发言。 句长中到长；无emoji；完整句号、括号补充、偶用分号。
    开头常界定资料来源或个人经历的范围；口癖“我能确认的是”，保留未知，不逢评论就索要论文。
  samples:
  - 我能确认的是这页写了适用年龄，截图把那行裁掉了（我第一次看也漏了）。先补全再讨论，可能说的根本不是同一阶段。我以前存过一整个文件夹，后来整理才发现，有几张连原文出自哪里都找不到了。
  - 住在这里以后，我买东西反而更少看产地了。有一次站在货架前查了十几分钟，才发现自己拿错了版本。语言没看懂的时候，进口两个字并不会替我解决问题，所以我现在会把不明白的地方先拍下来问清楚。
  - 这份资料面向成人，不能直接套给婴儿。我想先找找有没有对应年龄的说明，没找到之前就先不转发了。做实验养成的习惯是先看条件，不过我做的不是营养研究，这方面也得从头查，不能靠职业沾光。
  - 我们那次问诊给的建议很具体，跟孩子当时的情况有关。后来朋友问我，我把前面的背景也说了一遍，她才发现和自己家不是同一种情况。省掉这些只留一句‘这边医生都这么说’，转述起来方便，意思却可能已经变了。
  - 原文链接有吗？我想看一下那句话前后，不一定是在说产品之间的比较。
